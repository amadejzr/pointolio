name: pointolio
description: "A new Flutter project."
publish_to: 'none' 

version: 2.1.0+11

environment:
  sdk: ^3.10.3

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.30.1
  drift_flutter: ^0.3.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  go_router: ^18.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.0
  path_provider: ^2.1.5
  share_plus: ^13.2.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.5
  drift_dev: ^2.30.1
  flutter_launcher_icons: "^0.14.4"
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  fm_lints:
    git:
      url: https://github.com/fizzymizzy/fm_lints.git
      ref: main
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # Only the wordmark lockups ship in the app bundle (used on share cards).
    # Icon/adaptive/mark live under assets/logo/ as brand source; the launcher
    # icon is consumed at build time by flutter_launcher_icons, not bundled.
    - assets/logo/wordmark/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  fonts:
    # Variable fonts: a single file per family carries every weight along the
    # wght axis, so `fontWeight` in a TextStyle selects the weight directly.
    - family: Space Grotesk
      fonts:
        - asset: assets/font/SpaceGrotesk-VariableFont_wght.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/font/HankenGrotesk-VariableFont_wght.ttf
        - asset: assets/font/HankenGrotesk-Italic-VariableFont_wght.ttf
          style: italic

flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/icon/pointolio-icon-notebook-1024.png"

flutter_native_splash:
  # Centered Pointolio wordmark on the Notebook paper / Slate backgrounds,
  # matching the app's light and dark themes (PointolioTheme.bg).
  color: "#F7F8FB"
  color_dark: "#0E1016"
  image: assets/logo/wordmark/pointolio-wordmark-transparent.png
  image_dark: assets/logo/wordmark/pointolio-wordmark-light-transparent.png
  ios_content_mode: center
  # iOS-only project - keep other platforms off so generation stays scoped.
  ios: true
  android: false
  web: false